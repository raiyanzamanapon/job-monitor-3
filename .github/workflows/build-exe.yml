name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install pyinstaller requests beautifulsoup4 tzdata
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name JobMonitor --collect-data tzdata JobMonitorApp.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: JobMonitor-windows
          path: dist/JobMonitor.exe
